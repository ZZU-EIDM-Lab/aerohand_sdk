[project]
name = "aero-open-sdk"
version = "0.1.0.dev1"
description = "Python SDK and setup GUI for the Aero Hand Open robotic hand."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Mohit Yadav", email = "mohityadav@chestnut.bot" },
]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]

dependencies = [
    "esptool>=5.0,<6",
    "pyserial>=3.5,<4",
]

[project.optional-dependencies]
examples = ["pynput>=1.7.7,<2"]

[project.urls]
Repository = "https://github.com/lava-xa/aerohand_sdk"
Upstream = "https://github.com/Chestnut-Robotics/aero-hand-open"
Documentation = "https://chestnut-robotics.github.io/aero-hand-open/"

[build-system]
requires = ["uv_build>=0.8.18,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = ["examples/**"]

[project.scripts]
aero-open-gui = "aero_open_sdk.gui:main"
